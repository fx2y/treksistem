name = "treksistem-api"
main = "apps/api/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# External dependencies for bundling
[build]
command = ""

# Development configuration
# watch_dir = "apps/api/src"

[vars]
# Auth configuration
GOOGLE_REDIRECT_URI = "http://localhost:8787/api/auth/callback/google"
R2_PUBLIC_URL = "https://pub-treksistem-storage.r2.dev"
UPLOAD_URL_EXPIRES_IN_SECONDS = "300"

# Secrets are configured via wrangler secret put or .dev.vars for local dev
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET  
# JWT_SECRET
# R2_ACCOUNT_ID
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# ALERT_WEBHOOK_URL  # For schema validation alerts (e.g., Healthchecks.io, Slack webhook)

# D1 Database binding for local development and remote deployment
[[d1_databases]]
binding = "DB"
database_name = "treksistem-showcase-db"
database_id = "fc8ace76-5e4f-4bbe-8186-7d4198559f4d"
migrations_dir = "packages/db/migrations"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "treksistem-storage"
preview_bucket_name = "treksistem-storage"

# KV namespace for distributed rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "de6aa05e0c19403eab8221dd81971a1a"
preview_id = "de6aa05e0c19403eab8221dd81971a1a"

# KV namespace for alerting/monitoring
[[kv_namespaces]]
binding = "ALERTING_KV"
id = "af109e7b23dc44cbae3253f3265a66cb"
preview_id = "af109e7b23dc44cbae3253f3265a66cb"

# Queues for asynchronous processing
[[queues.producers]]
binding = "AUDIT_LOG_QUEUE"
queue = "audit-log-queue"

[[queues.consumers]]
queue = "audit-log-queue"
max_batch_size = 10
max_batch_timeout = 5

# Cron triggers
[triggers]
crons = [
  "0 2 1 * *",  # Monthly subscription invoice generation on the 1st at 2 AM UTC
  "0 3 * * *"   # Daily overdue invoice checker at 3 AM UTC
]